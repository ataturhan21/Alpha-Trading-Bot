name: Offline regression checks
on:
  push:
    paths:
      [
        "app/create_strategy.py",
        "app/strategy_logic.py",
        "test/test_strategy_logic.py",
        ".github/workflows/regression.yml",
      ]
  pull_request:
    paths:
      [
        "app/create_strategy.py",
        "app/strategy_logic.py",
        "test/test_strategy_logic.py",
        ".github/workflows/regression.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strategy-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - run: python -m pip install 'numpy>=1.24,<2' 'pandas>=1.5,<2'
      - run: python -m unittest test.test_strategy_logic -v
